            font-size: calc(var(--current-scale) * 1.1);
            font-weight: 700;
            color: #0f172a;
        }
        body.dark .session-title { color: #f8fafc; }
        .session-type {
            font-size: calc(var(--current-scale) * 0.85);
            color: #64748b;
            font-weight: 500;
        }
        body.dark .session-type { color: #94a3b8; }
