        function calculateWeekParity() {
            const refDateStr = localStorage.getItem('refDate') || '2026-08-31';
            const refParity = localStorage.getItem('refParity') || 'нечетная';
            const refDate = new Date(refDateStr);
            const target = new Date(currentSelectedDate);
            refDate.setHours(0,0,0,0);
            target.setHours(0,0,0,0);

            const diffTime = target.getTime() - refDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            currentWeekNumber = diffWeeks + 1;
            if (currentWeekNumber < 1) currentWeekNumber = 1;

            const parities = ['нечетная', 'четная'];
            const refIndex = refParity === 'нечетная' ? 0 : 1;
            let currentIdx = (refIndex + diffWeeks) % 2;
            if (currentIdx < 0) currentIdx = (2 + currentIdx) % 2;
            currentWeek = parities[currentIdx];
        }

        function changeWeekOffset(offsetWeeks) {
            const newDate = new Date(currentSelectedDate);
            newDate.setDate(newDate.getDate() + (offsetWeeks * 7));
            const refDate = new Date(localStorage.getItem('refDate') || '2026-08-31');
            const semesterEndDate = new Date(localStorage.getItem('semesterEnd') || '2027-01-31');

            if (newDate >= refDate && newDate <= semesterEndDate) {
                const direction = offsetWeeks > 0 ? 'left' : 'right';
                currentSelectedDate = newDate;
                calculateWeekParity();
                updateHeaderDate();
                renderCalendarStrip();
                renderScheduleWith120FpsSlide(direction);
            }
        }

        function goToToday() {
            triggerVibration();
            const now = new Date();
            const refDate = new Date(localStorage.getItem('refDate') || '2026-08-31');
            const semesterEndDate = new Date(localStorage.getItem('semesterEnd') || '2027-01-31');
            semesterEndDate.setHours(23, 59, 59, 999);

            const prevDate = new Date(currentSelectedDate);
            if (now >= refDate && now <= semesterEndDate) currentSelectedDate = now;
            else if (now > semesterEndDate) currentSelectedDate = semesterEndDate;
            else currentSelectedDate = refDate;

            const direction = currentSelectedDate > prevDate ? 'left' : 'right';
            currentDayName = dayNamesFull[currentSelectedDate.getDay()];
            calculateWeekParity();
            updateHeaderDate();
            renderCalendarStrip();
            renderScheduleWith120FpsSlide(direction);
        }

        function saveSettings() {
            const refDate = document.getElementById('refDateInput').value;
            const refParity = document.getElementById('refParitySelect').value;
            const semesterEnd = document.getElementById('semesterEndInput').value;

            localStorage.setItem('refDate', refDate);
            localStorage.setItem('refParity', refParity);
            localStorage.setItem('semesterEnd', semesterEnd);

            calculateWeekParity();
            updateHeaderDate();
            renderCalendarStrip();
            renderSchedule();
        }

        function toggleDarkMode() {
            const isDark = document.getElementById('darkModeToggle').checked;
            localStorage.setItem('darkMode', isDark);
            if (isDark) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }

        function toggleLiquidGlass() {
            const isGlass = document.getElementById('liquidGlassToggle').checked;
            localStorage.setItem('liquidGlass', isGlass);
            if (isGlass) document.body.classList.add('liquid-glass-on');
            else document.body.classList.remove('liquid-glass-on');
        }

        function toggleShadows() {
            const isShadows = document.getElementById('shadowsToggle').checked;
            localStorage.setItem('shadowsOn', isShadows);
            if (isShadows) document.body.classList.add('shadows-on');
            else document.body.classList.remove('shadows-on');
        }

        function switchTab(tabName, btnElement, index) {
            triggerVibration();
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btnElement.classList.add('active');

            activeTabIndex = index;
            const navBar = document.getElementById('navBar');
            const innerWidth = navBar.clientWidth - 12;
            const tabWidth = innerWidth / 3;
            pillTargetX = 6 + index * tabWidth;

            const mainHeader = document.getElementById('mainHeader');
            const calendarContainer = document.getElementById('calendarStripContainer');
            const weekNavBar = document.getElementById('weekNavBar');

            if (tabName === 'schedule') {
                document.getElementById('viewSchedule').classList.add('active');
                mainHeader.style.display = 'flex';
                calendarContainer.style.display = 'block';
                weekNavBar.style.display = 'grid';
                updateTodayButtonVisibility();
                setTimeout(() => updateDayPillPosition(), 50);
            } else if (tabName === 'session') {
                document.getElementById('viewSession').classList.add('active');
                mainHeader.style.display = 'none';
                calendarContainer.style.display = 'none';
                weekNavBar.style.display = 'none';
                document.getElementById('todayToast').classList.remove('show');
            } else if (tabName === 'other') {
                document.getElementById('viewOther').classList.add('active');
                mainHeader.style.display = 'none';
                calendarContainer.style.display = 'none';
                weekNavBar.style.display = 'none';
                document.getElementById('todayToast').classList.remove('show');
                
                const savedWeek = localStorage.getItem('editorSelectedWeek') || 'нечетная';
                const savedDay = localStorage.getItem('editorSelectedDay') || 'Понедельник';
                document.getElementById('editWeekSelect').value = savedWeek;
                document.getElementById('editDaySelect').value = savedDay;
                loadEditorLessonsToBuffer();
                renderVisualEditorLessons();
            }

            setTimeout(() => { window.dispatchEvent(new Event('scroll')); }, 100);
        }

        function updateTodayButtonVisibility() {
            const now = new Date();
            const isToday = currentSelectedDate.getDate() === now.getDate() &&
                            currentSelectedDate.getMonth() === now.getMonth() &&
                            currentSelectedDate.getFullYear() === now.getFullYear();
            const toastEl = document.getElementById('todayToast');
            if (!isToday) toastEl.classList.add('show');
            else toastEl.classList.remove('show');
        }

        function updateHeaderDate() {
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const dateStr = currentSelectedDate.toLocaleDateString('ru-RU', options);
            const formattedDate = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
            
            document.getElementById('currentDateLabel').textContent = `${formattedDate} • ${currentWeekNumber} неделя`;
            const weekName = scheduleData[currentWeek] ? scheduleData[currentWeek].name : 'Неделя';
            document.getElementById('weekTitleLabel').textContent = `${weekName}`;
            updateTodayButtonVisibility();
        }

        function renderCalendarStrip() {
            const strip = document.getElementById('calendarStrip');
            strip.innerHTML = '';

            const refDate = new Date(localStorage.getItem('refDate') || '2026-08-31');
            const semesterEndDate = new Date(localStorage.getItem('semesterEnd') || '2027-01-31');
            semesterEndDate.setHours(23, 59, 59, 999);

            const curr = new Date(currentSelectedDate);
            const day = curr.getDay();
            const diff = curr.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(curr.setDate(diff));

            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);

                const fullDayName = dayNamesFull[d.getDay()];
                const shortName = dayNamesShort[d.getDay()];
                const dateNum = d.getDate();
                const monthName = d.toLocaleDateString('ru-RU', { month: 'short' });

                const isSelected = fullDayName === currentDayName;
                const isOutOfBounds = d < refDate || d > semesterEndDate;
                const isRedDay = d.getDay() === 0 || d.getDay() === 6 || isHoliday(d);

                if (isSelected) activeDayIndex = i;

                const card = document.createElement('div');
                card.className = `day-card ${isSelected ? 'active' : ''} ${isOutOfBounds ? 'disabled' : ''} ${isRedDay ? 'red-day' : ''}`;
                card.innerHTML = `
                    <span class="day-name">${shortName}</span>
                    <span class="day-num">${dateNum}</span>
                    <span class="day-month">${monthName}</span>
                `;

                if (!isOutOfBounds) {
                    card.onclick = () => {
                        triggerVibration();
                        const prevDate = new Date(currentSelectedDate);
                        currentSelectedDate = new Date(d);
                        const direction = currentSelectedDate > prevDate ? 'left' : 'right';
                        currentDayName = fullDayName;
                        calculateWeekParity();
                        updateHeaderDate();
                        renderCalendarStrip();
                        renderScheduleWith120FpsSlide(direction);
                    };
                }
                strip.appendChild(card);
            }

            updateDayPillPosition(activeDayIndex);
        }

        function renderSession() {
            const container = document.getElementById('sessionContainer');
            const counterEl = document.getElementById('sessionWeeksCounter');
            const currentW = Math.min(totalSemesterWeeks, Math.max(1, currentWeekNumber));
            
            counterEl.textContent = `Неделя ${currentW} из ${totalSemesterWeeks}`;

            container.innerHTML = sessionData.map(item => `
                <div class="session-card">
                    <span class="session-semester">${item.semester}</span>
                    <div class="session-title">${capitalizeFirstLetter(item.subject)}</div>
                    <div class="session-type">Форма контроля: ${item.control}</div>
                </div>
            `).join('');
        }

        function renderScheduleWith120FpsSlide(direction = 'left') {
            const container = document.getElementById('scheduleContainer');
            const shiftX = direction === 'left' ? -40 : 40;
            
            container.style.transition = 'transform 0.2s cubic-bezier(0.3, 0, 0.8, 0.15), opacity 0.2s ease';
            container.style.transform = `translate3d(${shiftX}px, 0, 0)`;
            container.style.opacity = '0';

            setTimeout(() => {
                renderSchedule();
                container.style.transition = 'none';
                container.style.transform = `translate3d(${-shiftX}px, 0, 0)`;
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        container.style.transition = 'transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease';
                        container.style.transform = 'translate3d(0, 0, 0)';
                        container.style.opacity = '1';
                        window.dispatchEvent(new Event('scroll'));
                    });
                });
            }, 200);
        }

        function isLessonActiveInWeek(lessonWeeks, currentWeekNum) {
            if (!lessonWeeks || lessonWeeks.trim() === '' || lessonWeeks.toLowerCase() === 'все') return true;
            const nums = lessonWeeks.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
            if (nums.length === 0) return true;
            return nums.includes(currentWeekNum);
        }

        function getLessonTypeColor(typeStr, customColor) {
            if (!typeStr) return customColor || 'var(--accent-color)';
            const t = typeStr.toLowerCase();
            if (t.includes('лекц')) return '#a855f7';
            if (t.includes('практик') || t.includes('семин')) return '#3b82f6';
            if (t.includes('лаб')) return '#10b981';
            if (t.includes('коп') || t.includes('крп')) return '#f97316';
            return customColor || 'var(--accent-color)';
        }

        function toggleCardExpand(btnElement) {
            triggerVibration();
            const card = btnElement.closest('.glass-card');
            if (card) {
                card.classList.toggle('expanded');
                btnElement.textContent = card.classList.contains('expanded') ? '✕' : '?';
            }
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            const refDate = new Date(localStorage.getItem('refDate') || '2026-08-31');
            const semesterEndDate = new Date(localStorage.getItem('semesterEnd') || '2027-01-31');
            semesterEndDate.setHours(23, 59, 59, 999);

            if (currentSelectedDate < refDate || currentSelectedDate > semesterEndDate) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;">Вне рамок семестра</h3>
                        <p style="font-size: 0.95rem; color: #94a3b8;">Выбранная дата вне диапазона учебного семестра</p>
                    </div>
                `;
                return;
            }

            const weekObj = scheduleData[currentWeek];
            const allLessons = (weekObj && weekObj.days) ? (weekObj.days[currentDayName] || []) : [];
            let lessons = allLessons.filter(lesson => isLessonActiveInWeek(lesson.weeks, currentWeekNumber));

            if (lessons.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;">Пар не найдено</h3>
                        <p style="font-size: 0.95rem; color: #94a3b8;">В этот день нет занятий</p>
                    </div>
                `;
                return;
            }

            const isMobile = window.innerWidth <= 600;
            const now = new Date();
            const isToday = currentSelectedDate.getDate() === now.getDate() &&
                            currentSelectedDate.getMonth() === now.getMonth() &&
                            currentSelectedDate.getFullYear() === now.getFullYear();

            const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();
            const colorTagsEnabled = localStorage.getItem('colorTagsEnabled') !== 'false';
            const compactViewEnabled = localStorage.getItem('compactView') === 'true';

            container.innerHTML = lessons.map((lesson) => {
                let rawSubj = lesson.subject || '';
                let displaySubject = capitalizeFirstLetter(rawSubj);

                if (compactViewEnabled) {
                    const low = rawSubj.toLowerCase();
                    if (low === 'теоретическая механика') {
                        displaySubject = 'Термех';
                    } else if (low === 'инженерная геология') {
                        displaySubject = 'Инж. Геология';
                    } else if (low === 'электротехника и электроснабжение') {
                        displaySubject = 'Электротех.';
                    } else if (low.includes('социальное взаимодействие')) {
                        displaySubject = 'Социология';
                    } else if (low.includes('основы водоснабжения')) {
                        displaySubject = 'Основы ВиВ';
                    }
                }

                if (lesson.isBreak) {
                    return `
                        <div class="glass-card break ${compactViewEnabled ? 'compact-mode' : ''}">
                            <div class="card-main-row">
                                <div class="time-col">${lesson.start} - ${lesson.end}</div>
                                <div class="content-col">
                                    <div class="indicator" style="background-color: ${lesson.color || '#059669'};"></div>
                                    <div class="subject-info">
                                        <div class="subject-title">Перерыв</div>
                                        <div class="subject-sub">Свободное время</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                let details = [];
                if (lesson.type) details.push(capitalizeFirstLetter(lesson.type));
                if (lesson.corpus || lesson.room) {
                    let loc = '';
                    if (lesson.corpus) loc += `Корпус: ${lesson.corpus}`;
                    if (lesson.room) loc += ` ауд. ${lesson.room}`;
                    details.push(capitalizeFirstLetter(loc));
                }
                if (lesson.teacher) details.push(capitalizeFirstLetter(lesson.teacher));

                const detailsFormatted = isMobile ? details.join('<br>') : details.join(' • ');

                let progressPercent = 0;
                let isInProgress = false;
                let timeStatusText = '';

                if (isToday && lesson.start && lesson.end) {
                    const [startH, startM] = lesson.start.split(':').map(Number);
                    const [endH, endM] = lesson.end.split(':').map(Number);
                    const startTotal = startH * 60 + startM;
                    const endTotal = endH * 60 + endM;

                    if (currentTimeMinutes >= startTotal && currentTimeMinutes <= endTotal) {
                        isInProgress = true;
                        const totalDuration = endTotal - startTotal;
                        const elapsed = currentTimeMinutes - startTotal;
                        const remaining = endTotal - currentTimeMinutes;
                        progressPercent = totalDuration > 0 ? Math.min(100, Math.max(0, (elapsed / totalDuration) * 100)) : 0;
                        timeStatusText = `Идет сейчас • осталось ${remaining} мин`;
                    } else if (currentTimeMinutes < startTotal) {
                        const diff = startTotal - currentTimeMinutes;
                        if (diff <= 60) timeStatusText = `Начнется через ${diff} мин`;
                    }
                }

                const effectiveIndicatorColor = colorTagsEnabled ? getLessonTypeColor(lesson.type, lesson.color) : (lesson.color || 'var(--accent-color)');

                const roomText = lesson.room ? ` ауд. ${lesson.room}` : '';
                const titleWithRoom = compactViewEnabled && lesson.room ? `${displaySubject} <span class="compact-room-tag" style="font-size: 0.85em; opacity: 0.8; font-weight: 500;">(${roomText.trim()})</span>` : displaySubject;

                return `
                    <div class="glass-card ${isInProgress ? 'in-progress' : ''} ${compactViewEnabled ? 'compact-mode' : ''}" data-start="${lesson.start || ''}" data-end="${lesson.end || ''}" data-istoday="${isToday}">
                        <div class="card-main-row">
                            <div class="time-col">${lesson.start}<br>-<br>${lesson.end}</div>
                            <div class="content-col">
                                <div class="indicator" style="background-color: ${effectiveIndicatorColor};"></div>
                                <div class="subject-info">
                                    ${timeStatusText ? `<div class="live-status-badge">${timeStatusText}</div>` : ''}
                                    <div class="subject-title">${titleWithRoom}</div>
                                    <div class="subject-sub">${detailsFormatted}</div>
                                </div>
                                <button class="info-btn" onclick="toggleCardExpand(this)" title="Подробнее">?</button>
                            </div>
                        </div>
                        <div class="lesson-progress-container">
                            <div class="lesson-progress-bar" style="width: ${progressPercent}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateLessonProgressBars() {
            const now = new Date();
            const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();

            document.querySelectorAll('.glass-card').forEach(card => {
                const start = card.getAttribute('data-start');
                const end = card.getAttribute('data-end');
                const isToday = card.getAttribute('data-istoday') === 'true';
                const progressBar = card.querySelector('.lesson-progress-bar');

                if (isToday && start && end && progressBar) {
                    const [startH, startM] = start.split(':').map(Number);
                    const [endH, endM] = end.split(':').map(Number);
                    const startTotal = startH * 60 + startM;
                    const endTotal = endH * 60 + endM;

                    if (currentTimeMinutes >= startTotal && currentTimeMinutes <= endTotal) {
                        card.classList.add('in-progress');
                        const totalDuration = endTotal - startTotal;
                        const elapsed = currentTimeMinutes - startTotal;
                        const percent = totalDuration > 0 ? Math.min(100, Math.max(0, (elapsed / totalDuration) * 100)) : 0;
                        progressBar.style.width = percent + '%';
                    } else {
                        card.classList.remove('in-progress');
                    }
                }
            });
        }

        initApp();
    </script>
</body>
</html>
