            font-size: calc(var(--current-scale) * 0.88);
            color: var(--accent-color);
            font-weight: 600;
        }

        /* Парящая нижняя панель */
        .nav-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translate3d(-50%, 40px, 0);
            opacity: 0;
            pointer-events: none;
            width: calc(100% - 32px);
            max-width: 680px;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--global-radius);
            padding: 6px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            overflow: hidden;
            touch-action: none;
            will-change: transform, opacity;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        .nav-bar.visible {
            transform: translate3d(-50%, 0, 0) !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        body.dark .nav-bar {
            background: #141417;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-item {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            color: #64748b;
            font-size: calc(var(--current-scale) * 0.75);
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.3s ease;
        }

        .nav-item.active { color: #ffffff !important; }

        .nav-pill {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 0;
            background: color-mix(in srgb, var(--accent-color) 88%, transparent);
            border-radius: calc(var(--global-radius) - 6px);
            z-index: 1;
            box-shadow: 0 6px 18px var(--accent-glow);
            pointer-events: none;
            will-change: transform;
            transform: translate3d(6px, 0, 0);
        }

        .nav-item svg { width: 20px; height: 20px; margin-bottom: 2px; }

        .empty-state {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--global-radius);
            padding: 24px;
            text-align: center;
            color: #64748b;
            overflow: hidden;
        }

        .session-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--global-radius);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }
        body.dark .session-card {
            background: #141417;
            border-color: rgba(255, 255, 255, 0.06);
        }
        .session-semester {
            font-size: calc(var(--current-scale) * 0.75);
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
