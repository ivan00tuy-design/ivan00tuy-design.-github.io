<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>Расписание занятий</title>
    
    <!-- Динамический манифест для PWA (офлайн-режим) -->
    <script>
        const manifestData = {
            "name": "Расписание занятий",
            "short_name": "Расписание",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#09090b",
            "theme_color": "#4f46e5",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>",
                    "sizes": "192x192",
                    "type": "image/svg+xml"
                }
            ]
        };
        const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <style>
        :root {
            --base-scale: 16px;
            --scale-factor: 1;
            --current-scale: calc(var(--base-scale) * var(--scale-factor));
            --accent-color: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.3);
            --global-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #f3e8ff 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            margin: 0;
            font-size: var(--current-scale);
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            min-height: 100vh;
            position: relative;
            padding-bottom: 150px;
            background: #f8fafc;
            overflow-x: hidden;
        }

        @media (min-width: 720px) {
            body {
                background: linear-gradient(135deg, #cbd5e1 0%, #e2e8f0 50%, #f1f5f9 100%);
                padding: 20px 0;
            }
            .app-container {
                min-height: calc(100vh - 40px);
                border-radius: var(--global-radius);
                overflow: hidden;
                background: #f8fafc;
                border: 1px solid rgba(226, 232, 240, 0.8);
            }
        }

        /* Мягкие скругленные тени точно по форме элементов */
        body.shadows-on .settings-card,
        body.shadows-on .week-nav-bar,
        body.shadows-on .calendar-strip-wrapper,
        body.shadows-on .toast-popup,
        body.shadows-on .glass-card,
        body.shadows-on .session-card,
        body.shadows-on .lesson-editor-card,
        body.shadows-on .nav-bar {
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.04) !important;
        }
        body.shadows-on.dark .settings-card,
        body.shadows-on.dark .week-nav-bar,
        body.shadows-on.dark .calendar-strip-wrapper,
        body.shadows-on.dark .toast-popup,
        body.shadows-on.dark .glass-card,
        body.shadows-on.dark .session-card,
        body.shadows-on.dark .lesson-editor-card,
        body.shadows-on.dark .nav-bar {
            box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.5), 0 4px 12px -2px rgba(0, 0, 0, 0.3) !important;
        }

        /* Эффект Liquid Glass Apple-Style включен ТОЛЬКО когда класс активирован */
        body.liquid-glass-on .app-container {
            background: rgba(255, 255, 255, 0.35) !important;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        body.liquid-glass-on.dark .app-container {
            background: rgba(15, 15, 18, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        body.liquid-glass-on .settings-card,
        body.liquid-glass-on .week-nav-bar,
        body.liquid-glass-on .calendar-strip-wrapper,
        body.liquid-glass-on .toast-popup,
        body.liquid-glass-on .glass-card,
        body.liquid-glass-on .session-card,
        body.liquid-glass-on .lesson-editor-card,
        body.liquid-glass-on .nav-bar {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.22) 100%) !important;
            backdrop-filter: blur(28px) saturate(210%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(210%) !important;
            border: 1px solid rgba(255, 255, 255, 0.7) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.95) !important;
        }

        body.liquid-glass-on.dark .settings-card,
        body.liquid-glass-on.dark .week-nav-bar,
        body.liquid-glass-on.dark .calendar-strip-wrapper,
        body.liquid-glass-on.dark .toast-popup,
        body.liquid-glass-on.dark .glass-card,
        body.liquid-glass-on.dark .session-card,
        body.liquid-glass-on.dark .lesson-editor-card,
        body.liquid-glass-on.dark .nav-bar {
            background: linear-gradient(180deg, rgba(30, 30, 38, 0.55) 0%, rgba(18, 18, 24, 0.35) 100%) !important;
            backdrop-filter: blur(28px) saturate(210%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(210%) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.22) !important;
            color: #f1f5f9 !important;
        }

        /* Темная тема */
        body.dark {
            background: #09090b;
            color: #f1f5f9;
        }
        body.dark .app-container {
            background: #121215;
            border-color: rgba(255, 255, 255, 0.06);
        }
        body.dark .glass-card, body.dark .lesson-editor-card {
            background: #141417;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
        }
        body.dark .glass-card.break {
            background: #062318;
            border-color: #044e33;
        }
        body.dark .glass-card.in-progress {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        body.dark .day-card {
            color: #94a3b8;
        }
        body.dark .day-card.red-day { color: #f87171; }
        body.dark .day-card.active {
            color: #ffffff !important;
        }
        body.dark .subject-title { color: #f8fafc; }
        body.dark .subject-sub { color: #94a3b8; }
        body.dark .time-col { color: #94a3b8; }
        body.dark h1 { color: #f8fafc; }
        body.dark .date-subtitle { color: #94a3b8; }
        body.dark .settings-card, body.dark .toast-popup {
            background: #141417;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
        }
        body.dark input, body.dark select, body.dark textarea {
            background: #1c1c21;
            color: #f1f5f9;
            border-color: #2e2e36;
        }
        body.dark .settings-section-box {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
        }
        body.dark .week-nav-bar {
            background: #141417;
            border-color: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
        }
        body.dark .week-nav-btn, body.dark .today-btn, body.dark .action-btn {
            background: #1c1c21;
            color: #e2e8f0;
            border-color: #2e2e36;
        }
        body.dark .week-nav-btn:hover:not(:disabled), body.dark .today-btn:hover, body.dark .action-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
        }
        body.dark #weekTitleLabel {
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent-color) 35%, transparent) 0%, color-mix(in srgb, var(--accent-color) 15%, transparent) 100%);
            color: #ffffff;
            border-color: color-mix(in srgb, var(--accent-color) 40%, transparent);
        }

        .header {
            padding: calc(var(--current-scale) * 1.2) calc(var(--current-scale) * 1.2) calc(var(--current-scale) * 0.6) calc(var(--current-scale) * 1.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left h1 {
            font-size: calc(var(--current-scale) * 1.4);
            font-weight: bold;
            color: #1e293b;
        }
        .date-subtitle {
            font-size: calc(var(--current-scale) * 0.85);
            color: #64748b;
            margin-top: 2px;
            font-weight: 500;
        }
        
        .week-nav-bar {
            margin: 8px calc(var(--current-scale) * 1);
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--global-radius);
            padding: 6px 10px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
            overflow: hidden;
        }
        .week-nav-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: calc(var(--global-radius) - 6px);
            cursor: pointer;
            font-size: calc(var(--current-scale) * 0.8);
            font-weight: 600;
            color: var(--accent-color);
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .week-nav-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        #weekTitleLabel {
            background: color-mix(in srgb, var(--accent-color) 12%, transparent);
            color: var(--accent-color);
            padding: 8px 14px;
            border-radius: calc(var(--global-radius) - 6px);
            font-size: calc(var(--current-scale) * 0.85);
            font-weight: 700;
            text-align: center;
            border: 1px solid color-mix(in srgb, var(--accent-color) 25%, transparent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast-container {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(0, -10px, 0);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .toast-container.show {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
        }
        .toast-popup {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            padding: 6px 12px;
            border-radius: var(--global-radius);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            overflow: hidden;
        }
        .today-btn {
            background: transparent;
            border: none;
            font-size: calc(var(--current-scale) * 0.75);
            font-weight: 600;
            color: var(--accent-color);
            cursor: pointer;
            padding: 0;
        }

        #calendarStripContainer {
            padding: 4px calc(var(--current-scale) * 1) 10px calc(var(--current-scale) * 1);
        }
        .calendar-strip-wrapper {
            position: relative;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--global-radius);
            padding: 4px;
            overflow: hidden;
            touch-action: pan-y;
            isolation: isolate;
        }
        body.dark .calendar-strip-wrapper {
            background: #141417;
            border-color: rgba(255, 255, 255, 0.06);
        }

        .calendar-strip {
            position: relative;
            display: flex;
            gap: 0;
            z-index: 2;
        }
        
        .day-pill {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 0;
            background: color-mix(in srgb, var(--accent-color) 88%, transparent);
            border-radius: calc(var(--global-radius) - 6px);
            z-index: 1;
            box-shadow: 0 4px 12px var(--accent-glow);
            pointer-events: none;
            will-change: transform;
            transform: translate3d(4px, 0, 0);
        }

        .day-card {
            flex: 1;
            min-width: 0;
            height: 60px;
            border-radius: calc(var(--global-radius) - 6px);
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #334155;
            padding: 0 2px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.25s ease;
        }

        .day-card.red-day { color: #dc2626; }
        .day-card .day-name { font-size: calc(var(--current-scale) * 0.75); font-weight: 500; }
        .day-card .day-num { font-size: calc(var(--current-scale) * 0.95); font-weight: bold; margin-top: 1px; }
        .day-card .day-month { font-size: calc(var(--current-scale) * 0.6); color: #94a3b8; text-transform: lowercase; }
        .day-card.red-day .day-month { color: #fca5a5; }
        .day-card.active {
            color: #ffffff !important;
        }
        .day-card.active .day-month { color: #ffffff !important; }
        .day-card.disabled { opacity: 0.35; cursor: not-allowed; }
        
        .view-section {
            display: none;
            opacity: 0;
            transform: translate3d(0, 12px, 0);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 10px calc(var(--current-scale) * 1);
            flex-direction: column;
            gap: 12px;
            will-change: transform, opacity;
            width: 100%;
        }
        .view-section.active {
            display: flex;
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .schedule-viewport {
            position: relative;
            width: 100%;
            min-height: 380px;
            overflow: hidden;
        }
        #scheduleContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--global-radius);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }
        .glass-card.break {
            background: rgba(236, 253, 245, 0.85);
            border-color: #a7f3d0;
        }
        .glass-card.in-progress {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .card-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .time-col {
            font-size: calc(var(--current-scale) * 0.9);
            font-weight: 700;
            color: #475569;
            width: 85px;
            flex-shrink: 0;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .break .time-col { color: #047857; }
        .content-col {
            flex: 1;
            margin-left: 10px;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .indicator {
            width: 5px;
            min-height: 42px;
            border-radius: 4px;
            margin-right: 10px;
            flex-shrink: 0;
            align-self: stretch;
        }
        .break .indicator { min-height: auto; height: 38px; }
        .subject-info { flex: 1; word-break: break-word; min-width: 0; }
        .subject-title {
            font-size: calc(var(--current-scale) * 1.15);
            font-weight: 700;
            color: #0f172a;
            line-height: 1.35;
        }
        .break .subject-title { color: #065f46; }
        .subject-sub {
            font-size: calc(var(--current-scale) * 0.9);
            color: #475569;
            margin-top: 4px;
            line-height: 1.45;
        }
        .break .subject-sub { color: #047857; margin-top: 0; }

        /* Стили для Компактного вида */
        .glass-card.compact-mode .compact-room-tag {
            display: inline-block;
        }
        .glass-card.compact-mode.expanded .compact-room-tag {
            display: none !important;
        }
        .glass-card.compact-mode .subject-sub {
            display: none;
        }
        .glass-card.compact-mode.expanded .subject-sub {
            display: block;
        }
        .info-btn {
            display: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.15);
            color: var(--accent-color);
            font-weight: bold;
            font-size: calc(var(--current-scale) * 0.85);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            margin-left: 8px;
            transition: background-color 0.2s, transform 0.2s;
        }
        .info-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }
        .glass-card.compact-mode .info-btn {
            display: flex;
        }
        body.dark .info-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        
        .lesson-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            margin-top: 4px;
        }
        .lesson-progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s linear;
        }
        .glass-card.in-progress .lesson-progress-container {
            display: block;
        }

        .live-status-badge {
            display: inline-block;
            font-size: calc(var(--current-scale) * 0.7);
            font-weight: 700;
            text-transform: uppercase;
            background: var(--accent-color);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .settings-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--global-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            overflow: hidden;
        }

        .settings-section-box {
            background: rgba(241, 245, 249, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: calc(var(--global-radius) - 6px);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .settings-section-title {
            font-size: calc(var(--current-scale) * 0.85);
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .settings-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .settings-item label {
            font-size: calc(var(--current-scale) * 0.9);
            font-weight: 600;
            line-height: 1.35;
        }
        .settings-item input, .settings-item select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--global-radius);
            border: 1px solid #cbd5e1;
            font-size: calc(var(--current-scale) * 0.95);
            background: #fff;
            color: #1e293b;
            outline: none;
        }
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .accordion-body {
            display: none;
            flex-direction: column;
            gap: 14px;
            margin-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 12px;
            width: 100%;
        }
        .accordion-body.open { display: flex; }
        .arrow-icon {
            font-size: 0.9rem;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .arrow-icon.rotated { transform: rotate(180deg); }

        .lesson-editor-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: var(--global-radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        .editor-field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }
        .editor-field-group label {
            font-size: calc(var(--current-scale) * 0.75);
            font-weight: 600;
            color: #64748b;
        }
        body.dark .editor-field-group label { color: #94a3b8; }
        
        .lesson-editor-row { 
            display: flex; 
            gap: 8px; 
            width: 100%;
        }
        @media (max-width: 480px) {
            .lesson-editor-row { flex-direction: column; gap: 8px; }
        }

        .lesson-editor-row input {
            width: 100%;
            padding: 8px 12px;
            border-radius: var(--global-radius);
            border: 1px solid #cbd5e1;
            font-size: calc(var(--current-scale) * 0.85);
            background: #fff;
            color: #1e293b;
            box-sizing: border-box;
        }

        .action-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: var(--global-radius);
            font-weight: 600;
            cursor: pointer;
            font-size: calc(var(--current-scale) * 0.85);
            transition: opacity 0.2s;
            text-align: center;
        }
        .action-btn:hover { opacity: 0.9; }
        .danger-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: var(--global-radius);
            cursor: pointer;
            font-size: calc(var(--current-scale) * 0.8);
            align-self: flex-end;
            margin-top: 4px;
        }

        .app-version-footer {
