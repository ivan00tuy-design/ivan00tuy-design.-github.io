        function getAppVersion() {
            let buildPatch = parseInt(localStorage.getItem('appBuildPatch') || '0', 10);
            const lastSavedDate = localStorage.getItem('appBuildDate') || '';
            const todayStr = new Date().toDateString();

            if (lastSavedDate !== todayStr && lastSavedDate !== '') {
                buildPatch += 1;
                localStorage.setItem('appBuildPatch', buildPatch);
                localStorage.setItem('appBuildDate', todayStr);
            } else if (!lastSavedDate) {
                localStorage.setItem('appBuildDate', todayStr);
            }

            const currentMinor = APP_CONFIG.baseMinor + buildPatch;
            return `v${APP_CONFIG.baseMajor}.${currentMinor}`;
        }

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match('./')))
                    );
                });
            `;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }))).catch(() => {});
