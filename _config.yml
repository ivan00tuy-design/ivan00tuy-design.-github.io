        function initSwipeHandlers() {
            const viewSchedule = document.getElementById('viewSchedule');
            viewSchedule.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            viewSchedule.addEventListener('touchend', (e) => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });
        }

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) changeDayOffset(1);
            if (touchEndX > touchStartX + threshold) changeDayOffset(-1);
        }

        function initScrollFloatingNavBar() {
            const navBar = document.getElementById('navBar');

            const checkScroll = () => {
                if (activeTabIndex === 1 || activeTabIndex === 2) {
                    navBar.classList.add('visible');
                    return;
                }

                const scrollHeight = document.documentElement.scrollHeight;
                const clientHeight = window.innerHeight;
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollHeight <= clientHeight + 50) {
                    navBar.classList.add('visible');
                    return;
                }

                const isAtBottom = Math.ceil(scrollTop + clientHeight) >= scrollHeight - 60;

                if (isAtBottom) {
                    navBar.classList.add('visible');
                } else {
                    navBar.classList.remove('visible');
                }
            };

            window.addEventListener('scroll', checkScroll, { passive: true });
            window.addEventListener('resize', checkScroll, { passive: true });
            setTimeout(checkScroll, 300);
        }

        let activeDayIndex = 0;
        let dayPillTargetX = 0;
        let dayPillCurrentX = 0;
        let isUserDraggingDayPill = false;
        let dayDragTargetX = 0;

        function updateDayPillPosition(index = activeDayIndex) {
            const wrapper = document.getElementById('calendarStripWrapper');
            const pill = document.getElementById('dayPill');
            if (!wrapper || !pill) return;
            const innerWidth = wrapper.clientWidth - 8;
            const dayWidth = innerWidth / 7;
            pill.style.width = `${dayWidth}px`;
            dayPillTargetX = 4 + (index * dayWidth);
            if (!isUserDraggingDayPill) dayDragTargetX = dayPillTargetX;
        }

        function initDayPillPhysics() {
            const wrapper = document.getElementById('calendarStripWrapper');
            const pill = document.getElementById('dayPill');

            updateDayPillPosition();

            function dayPhysicsLoop() {
                const target = isUserDraggingDayPill ? dayDragTargetX : dayPillTargetX;
                dayPillCurrentX += (target - dayPillCurrentX) * 0.16;
                pill.style.transform = `translate3d(${dayPillCurrentX}px, 0, 0)`;
                requestAnimationFrame(dayPhysicsLoop);
            }
            requestAnimationFrame(dayPhysicsLoop);

            const handlePointerMove = (clientX) => {
                if (!isUserDraggingDayPill) return;
                const rect = wrapper.getBoundingClientRect();
                const innerWidth = wrapper.clientWidth - 8;
                const dayWidth = innerWidth / 7;
                let pointerX = clientX - rect.left - 4 - (dayWidth / 2);
                
                const maxTranslate = 4 + innerWidth - dayWidth;
                dayDragTargetX = Math.max(4, Math.min(pointerX, maxTranslate));
            };

            const handlePointerEnd = (clientX) => {
                if (!isUserDraggingDayPill) return;
                isUserDraggingDayPill = false;
                const rect = wrapper.getBoundingClientRect();
                const innerWidth = wrapper.clientWidth - 8;
                const relativeX = clientX - rect.left - 4;
                const dayWidth = innerWidth / 7;
                let targetIdx = Math.floor(relativeX / dayWidth);
                targetIdx = Math.max(0, Math.min(targetIdx, 6));

                const dayCards = document.querySelectorAll('.day-card');
                if (dayCards[targetIdx] && !dayCards[targetIdx].classList.contains('disabled')) {
                    dayCards[targetIdx].click();
                } else {
                    updateDayPillPosition();
                }
            };

            wrapper.addEventListener('touchstart', (e) => { isUserDraggingDayPill = true; handlePointerMove(e.touches[0].clientX); }, { passive: true });
            window.addEventListener('touchmove', (e) => { if(isUserDraggingDayPill) handlePointerMove(e.touches[0].clientX); }, { passive: true });
            window.addEventListener('touchend', (e) => { if(isUserDraggingDayPill) handlePointerEnd(e.changedTouches[0].clientX); });

            wrapper.addEventListener('mousedown', (e) => { isUserDraggingDayPill = true; handlePointerMove(e.clientX); });
            window.addEventListener('mousemove', (e) => { if(isUserDraggingDayPill) handlePointerMove(e.clientX); });
            window.addEventListener('mouseup', (e) => { if(isUserDraggingDayPill) handlePointerEnd(e.clientX); });

            window.addEventListener('resize', () => updateDayPillPosition());
        }

        let activeTabIndex = 0;
        let pillTargetX = 0;
        let pillCurrentX = 0;
        let isUserDraggingPill = false;
        let dragTargetX = 0;

        function init120FpsPhysicsPill() {
            const navBar = document.getElementById('navBar');
            const pill = document.getElementById('navPill');
            const buttons = navBar.querySelectorAll('.nav-item');

            const updateMetrics = () => {
                const innerWidth = navBar.clientWidth - 12;
                const tabWidth = innerWidth / buttons.length;
                pill.style.width = `${tabWidth}px`;
                pillTargetX = 6 + activeTabIndex * tabWidth;
                if (!isUserDraggingPill) dragTargetX = pillTargetX;
            };

            updateMetrics();

            function physicsLoop() {
                const target = isUserDraggingPill ? dragTargetX : pillTargetX;
                pillCurrentX += (target - pillCurrentX) * 0.14;
                pill.style.transform = `translate3d(${pillCurrentX}px, 0, 0)`;
                requestAnimationFrame(physicsLoop);
            }
            requestAnimationFrame(physicsLoop);

            const handlePointerMove = (clientX) => {
                if (!isUserDraggingPill) return;
                const navRect = navBar.getBoundingClientRect();
                const innerWidth = navBar.clientWidth - 12;
                const tabWidth = innerWidth / buttons.length;
                let pointerX = clientX - navRect.left - 6 - (tabWidth / 2);
                
                buttons.forEach((btn, idx) => {
                    const snapX = 6 + idx * tabWidth;
                    if (Math.abs(pointerX - snapX) < tabWidth * 0.4) {
                        pointerX = snapX + (pointerX - snapX) * 0.15;
                    }
                });

                const maxTranslate = 6 + innerWidth - tabWidth;
                dragTargetX = Math.max(6, Math.min(pointerX, maxTranslate));
            };

            const handlePointerEnd = (clientX) => {
                if (!isUserDraggingPill) return;
                isUserDraggingPill = false;
                const navRect = navBar.getBoundingClientRect();
                const innerWidth = navBar.clientWidth - 12;
                const relativeX = clientX - navRect.left - 6;
                const tabWidth = innerWidth / buttons.length;
                let targetIdx = Math.floor(relativeX / tabWidth);
                targetIdx = Math.max(0, Math.min(targetIdx, buttons.length - 1));
                buttons[targetIdx].click();
            };

            navBar.addEventListener('touchstart', (e) => { isUserDraggingPill = true; handlePointerMove(e.touches[0].clientX); }, { passive: true });
            window.addEventListener('touchmove', (e) => { if(isUserDraggingPill) handlePointerMove(e.touches[0].clientX); }, { passive: true });
            window.addEventListener('touchend', (e) => { if(isUserDraggingPill) handlePointerEnd(e.changedTouches[0].clientX); });

            navBar.addEventListener('mousedown', (e) => { isUserDraggingPill = true; handlePointerMove(e.clientX); });
            window.addEventListener('mousemove', (e) => { if(isUserDraggingPill) handlePointerMove(e.clientX); });
            window.addEventListener('mouseup', (e) => { if(isUserDraggingPill) handlePointerEnd(e.clientX); });

            window.addEventListener('resize', updateMetrics);
        }

